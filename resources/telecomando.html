<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RadioTray">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>RadioTray</title>
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6c6c70; --line: #d8d8dc;
  --accent: #e8573f; --accent-text: #ffffff; --chip: #ececf1; --star: #f0a020; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f; --line: #38383a;
    --accent: #ff6a4f; --accent-text: #ffffff; --chip: #2c2c2e; --star: #ffb52e; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
body { padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
       max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
#now { display: flex; gap: 14px; align-items: center; }
#cover { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: var(--chip); flex: none; }

#info { min-width: 0; flex: 1; }
#title { font-size: 19px; font-weight: 650; overflow: hidden; text-overflow: ellipsis;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#artist { font-size: 16px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#station, #quality { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#controls { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
#controls button { flex: 1; height: 54px; border: 0; border-radius: 14px; background: var(--chip); color: var(--text);
                   font-size: 24px; cursor: pointer; }
#controls button:active { opacity: .6; }
#controls #toggle { background: var(--accent); color: var(--accent-text); }
#controls #star.on { color: var(--star); }
#controls button:disabled { opacity: .35; }
#volume-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
#volume-row span { width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; accent-color: var(--accent); height: 30px; }
h2 { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
     margin: 18px 4px 8px; }
details { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
summary { list-style: none; padding: 13px 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "›"; color: var(--muted); transition: transform .15s; }
details[open] summary::after { transform: rotate(90deg); }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line);
       cursor: pointer; min-height: 52px; }
.row:active { background: var(--chip); }
.row.current { color: var(--accent); font-weight: 600; }
.logo { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; background: var(--chip); flex: none;
        display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); font-size: 15px; }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .text { flex: 1; min-width: 0; }
.recent .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent button { border: 0; background: none; font-size: 24px; color: var(--muted); width: 44px; height: 44px; cursor: pointer; }
.recent button.on { color: var(--star); }
#recent { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
#recent .row:first-child { border-top: 0; }
#banner { display: none; background: #b3261e; color: #fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 15px; }
.empty-note { color: var(--muted); padding: 14px; }
</style>
</head>
<body>
<div id="banner">Il Mac non risponde: RadioTray è acceso e sulla stessa rete Wi-Fi?</div>

<div class="card">
  <div id="now">
    <img id="cover" src="icon.png" alt="">
    <div id="info">
      <div id="title">RadioTray</div>
      <div id="artist"></div>
      <div id="station"></div>
      <div id="quality"></div>
    </div>
  </div>
  <div id="controls">
    <button id="prev" aria-label="Stazione precedente">&#x23EE;&#xFE0E;</button>
    <button id="toggle" aria-label="Accendi o spegni">&#x23EF;&#xFE0E;</button>
    <button id="next" aria-label="Stazione successiva">&#x23ED;&#xFE0E;</button>
    <button id="star" aria-label="Aggiungi ai brani preferiti">&#x2606;</button>
  </div>
  <div id="volume-row">
    <span style="text-align:left;width:auto">Volume</span>
    <input id="volume" type="range" min="0" max="100" step="1" value="50">
    <span id="volume-value">50%</span>
  </div>
</div>

<div id="groups"></div>

<h2>Ascoltati di recente</h2>
<div id="recent"><div class="empty-note">Ancora nessun brano.</div></div>

<script>
"use strict";
var state = {}, coverKey = null, volumeTimer = null, draggingVolume = false, lastStations = "", openGroups = {};

function $(id) { return document.getElementById(id); }
function q(params) {
  return Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
}
function get(path) {
  return fetch(path, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    $("banner").style.display = "none";
    return r.json();
  });
}
function offline() { $("banner").style.display = "block"; }
function send(params) {
  return fetch("api/cmd?" + q(params), { method: "POST", cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (s) { $("banner").style.display = "none"; showState(s); })
    .catch(offline);
}

function showState(s) {
  state = s;
  var playing = s.playing, active = s.playing || s.connecting;
  $("title").textContent = playing ? (s.title || "In riproduzione") : (s.connecting ? "Connessione…" : "Spenta");
  $("artist").textContent = playing ? (s.artist || "") : "";
  $("station").textContent = s.station || "";
  $("quality").textContent = playing ? (s.quality || "") : "";
  $("toggle").innerHTML = active ? "&#x25A0;&#xFE0E;" : "&#x25B6;&#xFE0E;";
  $("toggle").setAttribute("aria-label", active ? "Spegni" : "Accendi");
  var star = $("star");
  star.disabled = !s.canFavorite;
  star.classList.toggle("on", !!s.favorite);
  star.innerHTML = s.favorite ? "&#x2605;" : "&#x2606;";
  if (!draggingVolume) { $("volume").value = s.volume; $("volume-value").textContent = s.volume + "%"; }
  if (s.cover !== coverKey) {
    coverKey = s.cover;
    var img = $("cover");
    img.src = s.hasCover ? "img/cover?v=" + encodeURIComponent(s.cover) : "icon.png";
  }
  document.title = playing && s.title ? s.title + " – RadioTray" : "RadioTray";
  markCurrent();
}

function markCurrent() {
  var rows = document.querySelectorAll("#groups .row");
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    r.classList.toggle("current", (state.playing || state.connecting) && r.dataset.group === state.group && r.dataset.station === state.stationName);
  }
}

function logoElement(group, station) {
  var box = document.createElement("div");
  box.className = "logo";
  var short = station.replace(/^radio\s+/i, "");
  box.textContent = (/^[0-9]/.test(short) ? station.charAt(0) : short.charAt(0) || "?").toUpperCase();
  var img = new Image();
  img.className = "logo";
  img.alt = "";
  img.loading = "lazy";
  img.onload = function () { if (box.parentNode) box.parentNode.replaceChild(img, box); };
  img.src = "img/logo?" + q({ group: group, station: station });
  return box;
}

function showStations(data) {
  var key = JSON.stringify(data);
  if (key === lastStations) { markCurrent(); return; }
  lastStations = key;
  var root = $("groups");
  root.innerHTML = "";
  data.groups.forEach(function (g, index) {
    var d = document.createElement("details");
    if (openGroups[g.name] !== undefined ? openGroups[g.name] : index === 0) d.open = true;
    d.addEventListener("toggle", function () { openGroups[g.name] = d.open; });
    var sum = document.createElement("summary");
    sum.textContent = g.name;
    d.appendChild(sum);
    g.stations.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "row";
      row.dataset.group = s.group;
      row.dataset.station = s.name;
      row.appendChild(logoElement(s.group, s.name));
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = s.name;
      row.appendChild(name);
      row.addEventListener("click", function () { send({ "do": "play", group: s.group, station: s.name }); });
      d.appendChild(row);
    });
    root.appendChild(d);
  });
  markCurrent();
}

function showRecent(data) {
  var box = $("recent");
  box.innerHTML = "";
  if (!data.tracks.length) { box.innerHTML = '<div class="empty-note">Ancora nessun brano.</div>'; return; }
  data.tracks.forEach(function (t) {
    var row = document.createElement("div");
    row.className = "row recent";
    var text = document.createElement("div");
    text.className = "text";
    var a = document.createElement("div");
    a.className = "t";
    a.textContent = t.artist ? t.title + " – " + t.artist : t.title;
    var b = document.createElement("div");
    b.className = "s";
    b.textContent = t.time + (t.station ? " · " + t.station : "");
    text.appendChild(a);
    text.appendChild(b);
    var star = document.createElement("button");
    star.innerHTML = t.favorite ? "&#x2605;" : "&#x2606;";
    star.className = t.favorite ? "on" : "";
    star.setAttribute("aria-label", t.favorite ? "Già nei preferiti" : "Aggiungi ai preferiti");
    star.addEventListener("click", function (e) {
      e.stopPropagation();
      if (t.favorite) return;
      send({ "do": "favorite-recent", title: t.title, artist: t.artist, station: t.station }).then(refreshLists);
    });
    row.appendChild(text);
    row.appendChild(star);
    box.appendChild(row);
  });
}

function refreshState() { return get("api/state").then(showState).catch(offline); }
function refreshLists() {
  get("api/stations").then(showStations).catch(offline);
  get("api/recent").then(showRecent).catch(offline);
}

$("prev").addEventListener("click", function () { send({ "do": "prev" }); });
$("next").addEventListener("click", function () { send({ "do": "next" }); });
$("toggle").addEventListener("click", function () { send({ "do": "toggle" }); });
$("star").addEventListener("click", function () { send({ "do": "favorite" }).then(refreshLists); });
var volume = $("volume");
volume.addEventListener("input", function () {
  draggingVolume = true;
  $("volume-value").textContent = volume.value + "%";
  clearTimeout(volumeTimer);
  volumeTimer = setTimeout(function () { send({ "do": "volume", value: volume.value }); }, 150);
});
volume.addEventListener("change", function () {
  clearTimeout(volumeTimer);
  send({ "do": "volume", value: volume.value }).then(function () { draggingVolume = false; });
});

refreshState();
refreshLists();
setInterval(function () { if (!document.hidden) refreshState(); }, 2000);
setInterval(function () { if (!document.hidden) refreshLists(); }, 20000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) { refreshState(); refreshLists(); } });
</script>
</body>
</html>
