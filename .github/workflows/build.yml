name: build

# - push su un ramo di sviluppo: compila, prova e aggiorna la release di prova "anteprima"
# - push su main: compila e prova (il .dmg resta tra gli artifact)
# - etichetta vX.Y.Z, oppure avvio manuale con "versione" = X.Y.Z (crea l'etichetta su questo commit):
#   pubblica la versione stabile "RadioTray X.Y.Z" e toglie l'anteprima
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"   # ogni lunedì mattina: controllo che le stazioni rispondano ancora
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione stabile da pubblicare (per esempio 1.0.0); vuoto = solo compilazione"
        required: false
        default: ""

permissions:
  contents: write   # release con il .dmg

jobs:
  macos:
    # Runner Apple Silicon: l'app si compila per x86_64 (iMac 2009) con target 10.13.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versione
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"; echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.versione }}" ]; then
            v="${{ inputs.versione }}"; v="${v#v}"; echo "RELEASE_TAG=v$v" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/^VERSION *?= *//p' Makefile)
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Versione $v"
      - name: Versioni
        run: sw_vers && xcodebuild -version && clang --version
      - name: Test della logica (preferiti, playlist, titoli)
        run: make test
      - name: Compilazione (x86_64, macOS 10.13)
        run: make app ARCH=x86_64 VERSION=$VERSION
      - name: Verifica del binario (architettura, versione minima, firma)
        run: make check-mac ARCH=x86_64 VERSION=$VERSION
      - name: Prova di avvio sotto Rosetta (facoltativa)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build/RadioTray.app/Contents/MacOS/RadioTray & pid=$!
            sleep 8
            if kill -0 $pid 2>/dev/null; then echo "L'app è partita ed è ancora attiva dopo 8 s"; kill $pid; else wait $pid; echo "L'app è terminata subito (codice $?)"; exit 1; fi
          else
            echo "Rosetta non disponibile su questo runner: prova saltata"
          fi
      - name: Servono i controlli delle stazioni?
        id: changes
        # solo se sono cambiati gli elenchi delle stazioni o il codice che le legge,
        # oppure nel controllo settimanale o in un avvio manuale senza versione
        run: |
          run=false
          if [ "${{ github.event_name }}" = "schedule" ]; then run=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.versione }}" ]; then run=true; fi
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
               | grep -qE '^(resources/.*\.json|src/RT(StreamResolver|PlaylistParser|IcyMetadataReader|IcyParser)\.m|tests/check_stations\.m)$'; then
            run=true
          fi
          echo "stations=$run" >> "$GITHUB_OUTPUT"
          echo "Controlli delle stazioni: $run"
      - name: Stazioni predefinite raggiungibili (facoltativo)
        if: steps.changes.outputs.stations == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: make stations
      - name: Radio italiane consigliate raggiungibili (facoltativo)
        if: steps.changes.outputs.stations == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: make stations STATIONS=resources/stazioni-italiane.json
      - name: Diagnostica stazioni dell'utente (temporaneo)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          clang -std=gnu11 -fobjc-arc -fmodules tests/dump_icy.m src/RTIcyMetadataReader.m src/RTIcyParser.m -framework Foundation -o build/dump_icy
          build/dump_icy 90 https://icy.unitedradio.it/rmcweb008 http://icy.unitedradio.it/105Hits.mp3 \
            http://icecast.unitedradio.it/Radio105.mp3 https://str01.fluidstream.net/anni60.mp3
          echo "=== anni60 intestazioni"; curl -sS -m 10 -D - -o /dev/null -r 0-100 https://str01.fluidstream.net/anni60.mp3 | head -20
          make build/search_stations
          build/search_stations IT "Radio Siena" "Radio Italia" "Radio Monte Carlo" "Radio 105" "RDS" "Radio Deejay" "Subasio" || true
      - name: DMG
        run: make dmg ARCH=x86_64 VERSION=$VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: RadioTray-macOS-10.13-x86_64
          path: build/RadioTray.dmg
          compression-level: 0
          retention-days: 14
      - name: Release di prova "anteprima" (rami di sviluppo)
        if: github.ref_type == 'branch' && github.ref_name != 'main' && inputs.versione == ''
        run: |
          gh release delete anteprima --cleanup-tag -y 2>/dev/null || true
          gh release create anteprima build/RadioTray.dmg --prerelease --target "${{ github.sha }}" \
            --title "Anteprima (build ${{ github.run_number }}, ${{ github.ref_name }})" \
            --notes "Build automatica per macOS 10.13 (x86_64). Commit ${{ github.sha }}. Istruzioni nel file LEGGIMI.txt dentro il .dmg."
      - name: Versione stabile (etichetta vX.Y.Z o avvio manuale con versione)
        if: env.RELEASE_TAG != ''
        run: |
          cp build/RadioTray.dmg "build/RadioTray-$VERSION.dmg"
          gh release delete "$RELEASE_TAG" -y 2>/dev/null || true
          gh release create "$RELEASE_TAG" "build/RadioTray-$VERSION.dmg" --latest --target "${{ github.sha }}" \
            --title "RadioTray $VERSION" --notes-file docs/NOTE-VERSIONE.md
          # la versione stabile prende il posto dell'anteprima
          gh release delete anteprima --cleanup-tag -y 2>/dev/null || true
