name: build

# - push su un ramo di sviluppo: compila, prova e aggiorna la release di prova "anteprima" (.dmg per Mac e .zip per Windows)
# - push su main: compila e prova (il .dmg e lo .zip restano tra gli artifact)
# - etichetta vX.Y.Z, oppure avvio manuale con "versione" = X.Y.Z (crea l'etichetta su questo commit):
#   pubblica la versione stabile "RadioTray X.Y.Z" e toglie l'anteprima
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"   # ogni lunedì mattina: controllo che le stazioni rispondano ancora
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione stabile da pubblicare (per esempio 1.0.0); vuoto = solo compilazione"
        required: false
        default: ""

permissions:
  contents: write   # release con il .dmg e lo .zip

jobs:
  macos:
    # Runner Intel: come l'iMac 2009 (x86_64), i test girano sullo stesso tipo di processore, e la coda
    # è di solito più corta di quella dei Mac Apple Silicon. L'app si compila con target macOS 10.13.
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versione
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"; echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.versione }}" ]; then
            v="${{ inputs.versione }}"; v="${v#v}"; echo "RELEASE_TAG=v$v" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/^VERSION *?= *//p' Makefile)
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Versione $v"
      - name: Versioni
        run: sw_vers && xcodebuild -version && clang --version
      - name: Test della logica (preferiti, playlist, titoli)
        run: make test
      - name: Compilazione (x86_64, macOS 10.13)
        run: make app ARCH=x86_64 VERSION=$VERSION
      - name: Verifica del binario (architettura, versione minima, firma)
        run: make check-mac ARCH=x86_64 VERSION=$VERSION
      - name: Prova di avvio sotto Rosetta (facoltativa)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build/RadioTray.app/Contents/MacOS/RadioTray & pid=$!
            sleep 8
            if kill -0 $pid 2>/dev/null; then echo "L'app è partita ed è ancora attiva dopo 8 s"; kill $pid; else wait $pid; echo "L'app è terminata subito (codice $?)"; exit 1; fi
          else
            echo "Rosetta non disponibile su questo runner: prova saltata"
          fi
      - name: Servono i controlli delle stazioni?
        id: changes
        # solo se sono cambiati gli elenchi delle stazioni o il codice che le legge,
        # oppure nel controllo settimanale o in un avvio manuale senza versione
        run: |
          run=false
          if [ "${{ github.event_name }}" = "schedule" ]; then run=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.versione }}" ]; then run=true; fi
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
               | grep -qE '^(resources/.*\.json|src/RT(StreamResolver|PlaylistParser|IcyMetadataReader|IcyParser)\.m|tests/check_stations\.m)$'; then
            run=true
          fi
          echo "stations=$run" >> "$GITHUB_OUTPUT"
          echo "Controlli delle stazioni: $run"
      - name: Stazioni predefinite raggiungibili (facoltativo)
        if: steps.changes.outputs.stations == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: make stations
      - name: Radio italiane consigliate raggiungibili (facoltativo)
        if: steps.changes.outputs.stations == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: make stations STATIONS=resources/stazioni-italiane.json
      - name: DMG
        run: make dmg ARCH=x86_64 VERSION=$VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: RadioTray-macOS-10.13-x86_64
          path: build/RadioTray.dmg
          compression-level: 0
          retention-days: 14

  windows:
    # RadioTray per Windows 10: WinForms su .NET Framework 4.8, cartella portatile in uno .zip
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test della logica comune (stazioni, playlist, titoli, ICY, proxy)
        run: dotnet run --project windows/RadioTray.Tests -c Release -- resources/bookmarks.json resources/stazioni-italiane.json
      - name: Compilazione (.NET Framework 4.8)
        run: dotnet build windows/RadioTray/RadioTray.csproj -c Release
      - name: Prova di avvio (facoltativa)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $p = Start-Process windows/RadioTray/bin/Release/net48/RadioTray.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "L'app è terminata subito (codice $($p.ExitCode))"; exit 1 }
          Write-Host "L'app è partita ed è ancora attiva dopo 8 s"
          Stop-Process -Id $p.Id
          $log = Join-Path $env:APPDATA "RadioTray/radiotray.log"
          if (Test-Path $log) { Get-Content $log }
      - name: Zip (cartella portatile)
        run: |
          New-Item -ItemType Directory -Force build/RadioTray | Out-Null
          Copy-Item windows/RadioTray/bin/Release/net48/* build/RadioTray -Exclude *.pdb
          Copy-Item windows/LEGGIMI.txt build/RadioTray
          Get-ChildItem build/RadioTray
          Compress-Archive -Path build/RadioTray -DestinationPath build/RadioTray-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RadioTray-Windows
          path: build/RadioTray-Windows.zip
          retention-days: 14

  release:
    # pubblica insieme il .dmg e lo .zip; se una delle due compilazioni fallisce, l'anteprima esce con l'altra
    needs: [macos, windows]
    if: always() && !cancelled() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
      - name: Versione
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"; echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.versione }}" ]; then
            v="${{ inputs.versione }}"; v="${v#v}"; echo "RELEASE_TAG=v$v" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/^VERSION *?= *//p' Makefile)
          fi
          w=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' windows/RadioTray/RadioTray.csproj)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "WIN_VERSION=$w" >> "$GITHUB_ENV"
          echo "Versione $v (Windows $w)"
          ls -R dist || true
      - name: Release di prova "anteprima" (rami di sviluppo)
        if: github.ref_type == 'branch' && github.ref_name != 'main' && inputs.versione == ''
        run: |
          files=(); notes=""
          if [ -f dist/RadioTray-macOS-10.13-x86_64/RadioTray.dmg ]; then
            files+=(dist/RadioTray-macOS-10.13-x86_64/RadioTray.dmg)
            notes="$notes- RadioTray.dmg: macOS 10.13 (x86_64), istruzioni nel file LEGGIMI.txt dentro il .dmg"$'\n'
          fi
          if [ -f dist/RadioTray-Windows/RadioTray-Windows.zip ]; then
            files+=(dist/RadioTray-Windows/RadioTray-Windows.zip)
            notes="$notes- RadioTray-Windows.zip: Windows 10 ($WIN_VERSION, prova), istruzioni nel file LEGGIMI.txt dentro lo .zip"$'\n'
          fi
          if [ ${#files[@]} -eq 0 ]; then echo "Nessun file da pubblicare"; exit 1; fi
          gh release delete anteprima --cleanup-tag -y 2>/dev/null || true
          gh release create anteprima "${files[@]}" --prerelease --target "${{ github.sha }}" \
            --title "Anteprima (build ${{ github.run_number }}, ${{ github.ref_name }})" \
            --notes "Build automatica, commit ${{ github.sha }}."$'\n\n'"$notes"
      - name: Versione stabile (etichetta vX.Y.Z o avvio manuale con versione)
        if: env.RELEASE_TAG != ''
        run: |
          if [ "${{ needs.macos.result }}" != "success" ]; then echo "La compilazione per Mac non è riuscita: niente versione stabile"; exit 1; fi
          files=("dist/RadioTray-macOS-10.13-x86_64/RadioTray.dmg")
          cp "${files[0]}" "RadioTray-$VERSION.dmg"; files=("RadioTray-$VERSION.dmg")
          if [ "${{ needs.windows.result }}" = "success" ] && [ -f dist/RadioTray-Windows/RadioTray-Windows.zip ]; then
            cp dist/RadioTray-Windows/RadioTray-Windows.zip "RadioTray-Windows-$WIN_VERSION.zip"
            files+=("RadioTray-Windows-$WIN_VERSION.zip")
          fi
          gh release delete "$RELEASE_TAG" -y 2>/dev/null || true
          gh release create "$RELEASE_TAG" "${files[@]}" --latest --target "${{ github.sha }}" \
            --title "RadioTray $VERSION" --notes-file docs/NOTE-VERSIONE.md
          # la versione stabile prende il posto dell'anteprima
          gh release delete anteprima --cleanup-tag -y 2>/dev/null || true
